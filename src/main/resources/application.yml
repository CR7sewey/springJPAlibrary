spring:
  application:
    name: springJPAlibrary
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update # create-drop, none, create

    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
      show-sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/library
    username: postgres
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}


server:
  port: 8080


springdoc:
  override-with-generic-response: false # disabilita respostas genericas
